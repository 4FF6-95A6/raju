<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0F766E" />
<title>Medi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Medi - Modern UI with gradients, glassmorphism & animations.
   To recolor the brand, change --primary / --primary-dark.
   ========================================================= */
:root {
  /* Brand */
  --primary:        #14B8A6;
  --primary-dark:   #0F766E;
  --primary-darker: #115E59;
  --primary-light:  #CCFBF1;
  --primary-tint:   #F0FDFA;
  --accent:         #F59E0B;
  --accent-2:       #6366F1;

  /* Surfaces */
  --bg:        #F4F7FB;
  --bg-2:      #ECF2F8;
  --card:      #FFFFFF;
  --card-soft: #FAFBFD;
  --outline:   #E5EAF1;
  --outline-2: #EEF2F7;

  /* Text */
  --text:        #0F172A;
  --text-soft:   #64748B;
  --text-mute:   #94A3B8;

  /* Status */
  --success:        #10B981;
  --success-soft:   #D1FAE5;
  --warning:        #F59E0B;
  --warning-soft:   #FEF3C7;
  --danger:         #EF4444;
  --danger-soft:    #FEE2E2;
  --info:           #3B82F6;
  --info-soft:      #DBEAFE;
  --purple:         #8B5CF6;
  --purple-soft:    #EDE9FE;
  --pink:           #EC4899;
  --pink-soft:      #FCE7F3;

  /* Gradients */
  --grad-primary:   linear-gradient(135deg, #14B8A6 0%, #0F766E 60%, #115E59 100%);
  --grad-primary-2: linear-gradient(135deg, #2DD4BF 0%, #0EA5E9 100%);
  --grad-success:   linear-gradient(135deg, #34D399 0%, #059669 100%);
  --grad-danger:    linear-gradient(135deg, #FB7185 0%, #E11D48 100%);
  --grad-warning:   linear-gradient(135deg, #FBBF24 0%, #F97316 100%);
  --grad-info:      linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
  --grad-purple:    linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%);
  --grad-pink:      linear-gradient(135deg, #F472B6 0%, #DB2777 100%);
  --grad-bg:        linear-gradient(180deg, #F4F7FB 0%, #ECF2F8 100%);

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow:    0 4px 12px rgba(15, 23, 42, 0.06), 0 2px 4px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08), 0 4px 8px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.10), 0 8px 16px rgba(15, 23, 42, 0.06);
  --shadow-primary: 0 8px 24px rgba(20, 184, 166, 0.30);
  --shadow-danger:  0 8px 24px rgba(239, 68, 68, 0.25);
  --shadow-warning: 0 8px 24px rgba(245, 158, 11, 0.25);
  --shadow-info:    0 8px 24px rgba(59, 130, 246, 0.25);

  /* Geometry */
  --radius:    18px;
  --radius-lg: 22px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --topbar-h: 60px;
  --bottomnav-h: 70px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--grad-bg);
  background-attachment: fixed;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: contain;
  letter-spacing: -0.01em;
}
input, button, select, textarea { font-family: inherit; font-size: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: none; background: transparent; padding: 0; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 8px 24px rgba(20,184,166,0.40), 0 0 0 0 rgba(20,184,166,0.45); }
  50%      { box-shadow: 0 8px 24px rgba(20,184,166,0.40), 0 0 0 10px rgba(20,184,166,0); }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* App shell */
#app { min-height: 100%; padding-bottom: calc(var(--bottomnav-h) + var(--safe-bottom) + 8px); }
#app.no-bottom-nav { padding-bottom: 0; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--topbar-h);
  display: flex; align-items: center;
  padding: 0 8px;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(229, 234, 241, 0.6);
}
.topbar.gradient {
  background: var(--grad-primary);
  color: #fff;
  border-bottom: none;
}
.topbar h1 {
  flex: 1; margin: 0;
  font-size: 19px; font-weight: 700;
  letter-spacing: -0.02em;
  text-align: left; padding-left: 8px;
}
.topbar.gradient h1 { color: #fff; }
.icon-btn {
  width: 42px; height: 42px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 14px;
  color: var(--text);
  background: transparent;
  transition: background 0.15s, transform 0.1s;
}
.icon-btn:active { background: rgba(15, 23, 42, 0.08); transform: scale(0.93); }
.topbar.gradient .icon-btn { color: #fff; }
.topbar.gradient .icon-btn:active { background: rgba(255, 255, 255, 0.18); }

/* Bottom nav (glassmorphism) */
.bottom-nav {
  position: fixed; left: 12px; right: 12px;
  bottom: calc(12px + var(--safe-bottom));
  height: var(--bottomnav-h);
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: stretch;
  z-index: 20;
}
.bottom-nav button {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  color: var(--text-mute);
  font-size: 11px; font-weight: 600;
  transition: color 0.18s, transform 0.1s;
  position: relative;
}
.bottom-nav button .ic { font-size: 22px; transition: transform 0.18s; }
.bottom-nav button.active { color: var(--primary-dark); }
.bottom-nav button.active .ic { transform: scale(1.15); }
.bottom-nav button.active::before {
  content: '';
  position: absolute;
  top: 6px; left: 50%;
  width: 24px; height: 3px;
  border-radius: 2px;
  background: var(--grad-primary);
  transform: translateX(-50%);
}
.bottom-nav .fab {
  flex: 0 0 70px;
  position: relative;
  margin-top: -28px;
}
.bottom-nav .fab span.fab-circle {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--grad-primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; font-weight: 300;
  box-shadow: 0 10px 28px rgba(20, 184, 166, 0.45), 0 4px 12px rgba(20, 184, 166, 0.30);
  margin: 0 auto;
  transition: transform 0.15s;
  animation: pulseGlow 2.6s ease-in-out infinite;
}
.bottom-nav .fab:active span.fab-circle { transform: scale(0.92); }

/* Screens */
.screen { display: none; padding: 14px 16px 28px; animation: fadeIn 0.25s ease-out; }
.screen.active { display: block; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--outline-2);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
  transition: transform 0.12s, box-shadow 0.18s;
}
.card.clickable { cursor: pointer; }
.card.clickable:active { transform: scale(0.99); box-shadow: var(--shadow-xs); }

.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; }
.spacer { flex: 1; }

.section-title {
  margin: 18px 6px 10px;
  font-size: 12px; font-weight: 700;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Inputs */
.field { display: block; margin-bottom: 12px; }
.field label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 6px; padding-left: 4px;
  letter-spacing: 0.01em;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--outline);
  background: var(--card);
  outline: none;
  font-weight: 500;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary);
  background: var(--primary-tint);
  box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.14);
}
.field textarea { min-height: 88px; resize: vertical; }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  padding: 13px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 15px;
  text-align: center;
  user-select: none;
  letter-spacing: -0.01em;
  transition: transform 0.08s, box-shadow 0.18s, opacity 0.1s;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn-primary {
  background: var(--grad-primary);
  color: #fff;
  box-shadow: var(--shadow-primary);
}
.btn-primary:active { box-shadow: 0 4px 12px rgba(20, 184, 166, 0.35); }
.btn-outline {
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--outline);
}
.btn-outline:active { background: var(--bg-2); }
.btn-danger { background: var(--grad-danger); color: #fff; box-shadow: var(--shadow-danger); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }

/* Stat cards */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card {
  background: var(--card);
  border: 1px solid var(--outline-2);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.2s;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 100px; height: 100px;
  border-radius: 50%;
  opacity: 0.08;
  background: var(--grad-primary);
  pointer-events: none;
}
.stat-card:active { transform: scale(0.98); }
.stat-card .stat-head { display: flex; align-items: center; gap: 10px; }
.stat-card .stat-icon {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.stat-card .stat-label { font-size: 12px; color: var(--text-soft); font-weight: 600; }
.stat-card .stat-value {
  margin-top: 10px;
  font-size: 24px; font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text);
}

/* Status chip */
.chip {
  display: inline-flex; align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.04em;
}
.chip-success { background: var(--success-soft); color: var(--success); }
.chip-warning { background: var(--warning-soft); color: #B45309; }
.chip-danger  { background: var(--danger-soft);  color: var(--danger); }
.chip-info    { background: var(--info-soft);    color: var(--info); }
.chip-primary { background: var(--primary-light); color: var(--primary-dark); }

/* List items */
.list-item {
  background: var(--card);
  border: 1px solid var(--outline-2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s, box-shadow 0.18s, border-color 0.18s;
  cursor: pointer;
}
.list-item:active { transform: scale(0.99); box-shadow: var(--shadow-xs); }
.avatar {
  width: 44px; height: 44px;
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 17px;
  flex-shrink: 0;
}
.avatar.primary { background: var(--grad-primary); color: #fff; box-shadow: 0 4px 12px rgba(20,184,166,0.30); }
.avatar.info    { background: var(--grad-info);    color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.28); }
.avatar.warning { background: var(--grad-warning); color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,0.28); }
.avatar.danger  { background: var(--grad-danger);  color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.28); }
.avatar.success { background: var(--grad-success); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.28); }
.list-item .title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.list-item .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; font-weight: 500; }

/* Empty state */
.empty {
  text-align: center;
  padding: 56px 24px;
  color: var(--text-soft);
  animation: fadeUp 0.35s ease-out;
}
.empty .ic {
  font-size: 56px; margin-bottom: 14px;
  display: inline-block;
  filter: grayscale(0.2);
}
.empty h3 { margin: 8px 0 4px; color: var(--text); font-size: 18px; font-weight: 700; }
.empty p { margin: 0; font-size: 13.5px; max-width: 280px; margin: 0 auto; }

/* Search */
.search-bar {
  display: flex; align-items: center;
  background: var(--card);
  border: 1.5px solid var(--outline);
  border-radius: 16px;
  padding: 0 14px;
  height: 48px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(20,184,166,0.12); }
.search-bar input {
  flex: 1;
  border: none; background: transparent; outline: none;
  padding: 0 8px;
  font-size: 14.5px; font-weight: 500;
}
.search-bar .ic { color: var(--text-mute); font-size: 18px; }

/* FAB */
.fab-bottom {
  position: fixed;
  right: 22px;
  bottom: calc(var(--bottomnav-h) + var(--safe-bottom) + 26px);
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--grad-primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 30px rgba(20,184,166,0.50), 0 4px 12px rgba(20,184,166,0.30);
  font-size: 30px; font-weight: 300;
  z-index: 25;
  transition: transform 0.12s, box-shadow 0.18s;
}
.fab-bottom:active { transform: scale(0.92); }

/* Header banner (Home) */
.header-banner {
  background: var(--grad-primary);
  color: #fff;
  margin: -14px -16px 18px;
  padding: 32px 22px 36px;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(15, 118, 110, 0.25);
}
.header-banner::before {
  content: '';
  position: absolute;
  top: -60px; right: -40px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 70%);
  pointer-events: none;
}
.header-banner::after {
  content: '';
  position: absolute;
  bottom: -80px; left: -50px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.10), transparent 70%);
  pointer-events: none;
}
.header-banner > * { position: relative; z-index: 1; }
.header-banner .greet { font-size: 14px; opacity: 0.92; font-weight: 500; }
.header-banner .store { font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: -0.025em; }
.header-banner .meta {
  display: inline-block;
  font-size: 12px; margin-top: 8px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(8px);
  padding: 5px 12px;
  border-radius: 999px;
  font-weight: 600;
}

/* Quick actions */
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quick {
  background: var(--card);
  border: 1px solid var(--outline-2);
  border-radius: var(--radius);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.18s;
}
.quick:active { transform: scale(0.96); }
.quick .ic-circle {
  width: 48px; height: 48px;
  margin: 0 auto 8px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
}
.quick:nth-child(1) .ic-circle { background: var(--grad-primary); box-shadow: 0 6px 16px rgba(20,184,166,0.35); }
.quick:nth-child(2) .ic-circle { background: var(--grad-info);    box-shadow: 0 6px 16px rgba(59,130,246,0.32); }
.quick:nth-child(3) .ic-circle { background: var(--grad-warning); box-shadow: 0 6px 16px rgba(245,158,11,0.32); }
.quick .qlabel { font-size: 12.5px; font-weight: 700; color: var(--text); }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  padding: 20px;
  animation: fadeIn 0.18s ease-out;
}
.modal {
  width: 100%;
  max-width: 440px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow-lg);
  padding: 22px;
  animation: slideUp 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal h2 { margin: 0 0 12px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(var(--bottomnav-h) + var(--safe-bottom) + 32px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(12px);
  color: #fff;
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 13px; font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 100;
  max-width: 80%;
  text-align: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.30);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Cart line */
.cart-line {
  background: linear-gradient(135deg, rgba(204, 251, 241, 0.6), rgba(207, 250, 254, 0.4));
  border: 1px solid rgba(20, 184, 166, 0.18);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.cart-line .name { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
.cart-line .meta { font-size: 12px; color: var(--text-soft); margin-top: 4px; font-weight: 500; }
.cart-line .price { font-weight: 700; font-size: 13.5px; color: var(--primary-dark); margin-top: 4px; }

/* Totals card */
.totals-card {
  background: var(--grad-primary);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-primary);
  position: relative;
  overflow: hidden;
}
.totals-card::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 70%);
}
.totals-card > * { position: relative; }
.total-row {
  display: flex; justify-content: space-between;
  padding: 5px 0;
  font-size: 14px;
  color: rgba(255,255,255,0.90);
  font-weight: 500;
}
.total-row.bold {
  font-weight: 800; font-size: 18px;
  padding-top: 12px;
  border-top: 1px dashed rgba(255,255,255,0.30);
  margin-top: 6px;
  color: #fff;
  letter-spacing: -0.01em;
}
.totals-card input {
  background: rgba(255,255,255,0.18) !important;
  border: 1px solid rgba(255,255,255,0.28) !important;
  color: #fff !important;
  font-weight: 600;
}
.totals-card input::placeholder { color: rgba(255,255,255,0.6); }

/* Tag */
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }

/* Invoice print view */
.invoice-paper {
  background: #fff;
  color: #000;
  padding: 28px 22px;
  border-radius: 20px;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--outline-2);
}
.invoice-paper h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.025em; }
.invoice-paper .center { text-align: center; }
.invoice-paper table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
.invoice-paper th { text-align: left; padding: 8px 4px; border-bottom: 2px solid #1F2937; font-weight: 700; color: #1F2937; }
.invoice-paper td { padding: 8px 4px; border-bottom: 1px dashed #D1D5DB; vertical-align: top; }
.invoice-paper .right { text-align: right; }
.invoice-paper .totals { margin-top: 14px; padding-top: 6px; }
.invoice-paper .totals .row2 { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.invoice-paper .totals .row2.bold { font-weight: 800; font-size: 15px; border-top: 2px solid #1F2937; padding-top: 8px; margin-top: 6px; }

/* Print rules */
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
  .topbar, .bottom-nav, .fab-bottom, .toast, .modal-overlay { display: none !important; }
  .invoice-paper { box-shadow: none; border-radius: 0; padding: 0; border: none; }
}

/* Misc */
.divider { height: 1px; background: var(--outline); margin: 10px 0; }
.muted { color: var(--text-soft); }
.text-danger  { color: var(--danger); }
.text-success { color: var(--success); }
.text-right   { text-align: right; }
.text-center  { text-align: center; }
.flex { display: flex; }
.gap-8  { gap: 8px; }
.gap-12 { gap: 12px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.bold     { font-weight: 800; letter-spacing: -0.01em; }
.semibold { font-weight: 700; letter-spacing: -0.005em; }
.fs-12 { font-size: 12px; }
.fs-14 { font-size: 14px; }
.fs-16 { font-size: 16px; }
.fs-18 { font-size: 18px; }
</style>
</head>
<body>

<div id="app">
  <!-- Top bar (rendered per screen) -->
  <header id="topbar" class="topbar"><h1>Medi</h1></header>

  <!-- Print area for invoice (hidden visually until print) -->
  <div id="print-area" style="display:none"></div>

  <!-- Screens -->
  <main id="main">

    <!-- HOME -->
    <section id="screen-home" class="screen active"></section>

    <!-- STOCK -->
    <section id="screen-stock" class="screen"></section>
    <section id="screen-add-stock" class="screen"></section>

    <!-- SALE -->
    <section id="screen-sale" class="screen"></section>
    <section id="screen-invoice" class="screen"></section>

    <!-- MORE -->
    <section id="screen-more" class="screen"></section>
    <section id="screen-customers" class="screen"></section>
    <section id="screen-add-customer" class="screen"></section>
    <section id="screen-pending" class="screen"></section>
    <section id="screen-expiry" class="screen"></section>
    <section id="screen-profile" class="screen"></section>

  </main>

  <!-- Bottom nav -->
  <nav id="bottomnav" class="bottom-nav">
    <button data-tab="home" class="active"><span class="ic">🏠</span><span>Home</span></button>
    <button data-tab="stock"><span class="ic">📦</span><span>Stock</span></button>
    <button data-tab="sale" class="fab"><span class="fab-circle">＋</span><span style="margin-top:4px">Sale</span></button>
    <button data-tab="more"><span class="ic">⋯</span><span>More</span></button>
  </nav>
</div>

<!-- Modal & toast container -->
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   Medi - All app logic.
   Architecture:
   1. Constants
   2. Storage (localStorage-backed db)
   3. Helpers (uid, format, dates)
   4. Navigation / topbar
   5. Toast / modal helpers
   6. GST calculation
   7. Render functions for each screen
   8. Global event delegation
   9. Init
   ========================================================= */

const MedStock = (() => {
  'use strict';

  /* ---------- 1. Constants ---------- */
  const GST_RATES = [0, 5, 12, 18, 28];
  const UNITS = ['BOX', 'PIECES', 'BOTTLE', 'STRIP'];
  const PAYMENT_MODES = ['CASH', 'UPI', 'CARD', 'CREDIT'];
  const STORAGE_KEY = 'medi_db_v1';

  /* ---------- 2. Storage ---------- */
  const defaultDb = () => ({
    medicines: [],
    customers: [],
    customerPrices: [],   // { id, customerId, medicineId, specialPrice }
    sales: [],
    saleItems: [],
    payments: [],
    profile: {
      ownerName: '',
      storeName: '',
      gstNo: '',
      drugLicenseNo: '',
      address: '',
      phone: '',
      email: '',
      state: '',
      stateCode: '',
      invoicePrefix: 'INV',
      lastInvoiceSeq: 0
    }
  });

  let db = defaultDb();

  function loadDb() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        db = Object.assign(defaultDb(), JSON.parse(raw));
      }
    } catch (e) {
      console.warn('Failed to load db', e);
      db = defaultDb();
    }
  }

  function saveDb() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  /* ---------- 3. Helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function rs(n) {
    const v = Number(n) || 0;
    return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function num2(n) { return (Math.round((Number(n) || 0) * 100) / 100); }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function fmtDateTime(ts) {
    if (!ts) return '—';
    const d = new Date(Number(ts));
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function dateInputValue(ts) {
    if (!ts) return '';
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '';
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function parseDateInput(s) {
    if (!s) return 0;
    const t = new Date(s + 'T00:00:00').getTime();
    return isNaN(t) ? 0 : t;
  }
  function startOfDay(ts) { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  function endOfDay(ts) { const d = new Date(ts); d.setHours(23,59,59,999); return d.getTime(); }
  function daysFromNow(d) { return Date.now() + d * 86400000; }
  function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }

  function nextInvoiceNo() {
    db.profile.lastInvoiceSeq = (db.profile.lastInvoiceSeq || 0) + 1;
    const pre = (db.profile.invoicePrefix || 'INV').toUpperCase();
    return pre + '-' + String(db.profile.lastInvoiceSeq).padStart(5, '0');
  }

  /* ---------- 4. Navigation / topbar ---------- */
  const TAB_OF_SCREEN = {
    home: 'home',
    stock: 'stock', 'add-stock': 'stock',
    sale: 'sale', invoice: 'sale',
    more: 'more', customers: 'more', 'add-customer': 'more',
    pending: 'more', expiry: 'more', profile: 'more'
  };
  const screenStack = ['home'];

  function show(name, opts) {
    opts = opts || {};
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('screen-' + name);
    if (!el) { console.warn('No screen ' + name); return; }
    el.classList.add('active');
    if (!opts.replace) {
      // Don't push duplicates back-to-back
      if (screenStack[screenStack.length - 1] !== name) screenStack.push(name);
    } else {
      screenStack[screenStack.length - 1] = name;
    }
    // Render content
    const renderer = renderers[name];
    if (renderer) renderer(opts.arg);
    // Highlight bottom nav
    const tab = TAB_OF_SCREEN[name] || 'home';
    document.querySelectorAll('#bottomnav button[data-tab]').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    // Scroll to top
    window.scrollTo(0, 0);
  }

  function back() {
    if (screenStack.length <= 1) return false;
    screenStack.pop();
    const prev = screenStack[screenStack.length - 1];
    show(prev, { replace: true });
    return true;
  }

  function setTopBar({ title, gradient, left, right }) {
    const tb = document.getElementById('topbar');
    tb.className = 'topbar' + (gradient ? ' gradient' : '');
    tb.innerHTML = '';
    if (left) {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.innerHTML = left.icon || '←';
      b.onclick = left.onclick;
      tb.appendChild(b);
    }
    const h = document.createElement('h1');
    h.textContent = title || '';
    tb.appendChild(h);
    if (right) {
      const r = document.createElement('button');
      r.className = 'icon-btn';
      r.innerHTML = right.icon;
      r.onclick = right.onclick;
      tb.appendChild(r);
    }
  }

  /* ---------- 5. Toast / modal ---------- */
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function modal(htmlContent, options) {
    options = options || {};
    const root = document.getElementById('modal-root');
    root.innerHTML = '';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = htmlContent;
    overlay.appendChild(m);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay && !options.persistent) closeModal();
    });
    root.appendChild(overlay);
    if (options.onMount) options.onMount(m);
    return m;
  }

  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
  }

  function confirmDialog(msg, onYes, yesLabel) {
    modal(`
      <h2>Are you sure?</h2>
      <p class="muted">${escapeHtml(msg)}</p>
      <div class="modal-actions">
        <button class="btn btn-outline" data-act="cancel">Cancel</button>
        <button class="btn btn-danger" data-act="ok">${escapeHtml(yesLabel || 'Yes, delete')}</button>
      </div>
    `, {
      onMount: (m) => {
        m.querySelector('[data-act="cancel"]').onclick = closeModal;
        m.querySelector('[data-act="ok"]').onclick = () => { closeModal(); onYes && onYes(); };
      }
    });
  }

  /* ---------- 6. GST calc ---------- */
  function gstCalc(unitPrice, qty, gstPct, isInterState) {
    const taxable = num2(unitPrice * qty);
    const gst = num2(taxable * gstPct / 100);
    const cgst = isInterState ? 0 : num2(gst / 2);
    const sgst = isInterState ? 0 : num2(gst - cgst);
    const igst = isInterState ? gst : 0;
    return { taxable, gst, cgst, sgst, igst, total: num2(taxable + gst) };
  }

  /* ---------- 7. Renderers ---------- */
  const renderers = {};

  /* ===== HOME ===== */
  renderers.home = function () {
    setTopBar({ title: '', gradient: false, left: null, right: null });
    document.getElementById('topbar').style.display = 'none'; // home uses banner instead

    const today = Date.now();
    const startToday = startOfDay(today);
    const endToday = endOfDay(today);
    const todaysSales = db.sales.filter(s => s.date >= startToday && s.date <= endToday);
    const todaysTotal = todaysSales.reduce((a, s) => a + s.total, 0);
    const todaysCount = todaysSales.length;
    const totalPending = db.sales.reduce((a, s) => a + (s.pendingAmount || 0), 0);
    const expiringSoon = db.medicines.filter(m => m.expiryDate > 0 && m.expiryDate <= daysFromNow(90));
    const lowStock = db.medicines.filter(m => m.quantity <= (m.lowStockThreshold || 10));
    const recentSales = db.sales.slice().sort((a, b) => b.date - a.date).slice(0, 5);

    const ownerName = db.profile.ownerName || 'there';
    const storeName = db.profile.storeName || 'Medi';

    const el = document.getElementById('screen-home');
    el.innerHTML = `
      <div class="header-banner">
        <div class="greet">Hello, ${escapeHtml(ownerName)}</div>
        <div class="store">${escapeHtml(storeName)}</div>
        <div class="meta">${fmtDate(today)}</div>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-head">
            <div class="stat-icon" style="background:var(--success-soft);color:var(--success)">💰</div>
            <div class="stat-label">Today's Sales</div>
          </div>
          <div class="stat-value">${rs(todaysTotal)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-head">
            <div class="stat-icon" style="background:var(--info-soft);color:var(--info)">🧾</div>
            <div class="stat-label">Bills Today</div>
          </div>
          <div class="stat-value">${todaysCount}</div>
        </div>
        <div class="stat-card clickable" data-go="pending">
          <div class="stat-head">
            <div class="stat-icon" style="background:var(--danger-soft);color:var(--danger)">⏳</div>
            <div class="stat-label">Pending Payments</div>
          </div>
          <div class="stat-value">${rs(totalPending)}</div>
        </div>
        <div class="stat-card clickable" data-go="expiry">
          <div class="stat-head">
            <div class="stat-icon" style="background:var(--warning-soft);color:var(--warning)">⏰</div>
            <div class="stat-label">Expiring Soon</div>
          </div>
          <div class="stat-value">${expiringSoon.length}</div>
        </div>
      </div>

      <div class="section-title">Quick Actions</div>
      <div class="quick-grid">
        <div class="quick clickable" data-go="sale">
          <div class="ic-circle">＋</div>
          <div class="qlabel">New Sale</div>
        </div>
        <div class="quick clickable" data-go="add-stock">
          <div class="ic-circle">📦</div>
          <div class="qlabel">Add Stock</div>
        </div>
        <div class="quick clickable" data-go="add-customer">
          <div class="ic-circle">👤</div>
          <div class="qlabel">Customer</div>
        </div>
      </div>

      ${lowStock.length ? `
        <div class="section-title">Low Stock</div>
        ${lowStock.slice(0, 3).map(m => `
          <div class="list-item">
            <div class="avatar warning">⚠</div>
            <div class="grow">
              <div class="title">${escapeHtml(m.name)}</div>
              <div class="sub">Only ${m.quantity} left</div>
            </div>
            <span class="chip chip-warning">LOW</span>
          </div>
        `).join('')}
      ` : ''}

      ${recentSales.length ? `
        <div class="section-title">Recent Sales</div>
        ${recentSales.map(s => `
          <div class="list-item clickable" data-go="invoice" data-arg="${s.id}">
            <div class="avatar success">📄</div>
            <div class="grow">
              <div class="title">${escapeHtml(s.invoiceNo)}</div>
              <div class="sub">${escapeHtml(s.customerName)} • ${fmtDate(s.date)}</div>
            </div>
            <div class="semibold">${rs(s.total)}</div>
          </div>
        `).join('')}
      ` : ''}
    `;
  };

  /* ===== STOCK ===== */
  let stockSearch = '';
  renderers.stock = function () {
    document.getElementById('topbar').style.display = '';
    setTopBar({ title: 'Stock Inventory', gradient: false, left: null, right: null });
    const list = db.medicines
      .filter(m => !stockSearch || m.name.toLowerCase().includes(stockSearch) || (m.batchNo || '').toLowerCase().includes(stockSearch))
      .sort((a, b) => a.name.localeCompare(b.name));

    const el = document.getElementById('screen-stock');
    el.innerHTML = `
      <div class="search-bar">
        <span class="ic">🔍</span>
        <input id="stock-search" placeholder="Search medicine or batch" value="${escapeHtml(stockSearch)}" />
      </div>
      ${list.length === 0 ? `
        <div class="empty">
          <div class="ic">📦</div>
          <h3>No stock yet</h3>
          <p>Tap the + button to add your first medicine</p>
        </div>
      ` : list.map(m => stockListItem(m)).join('')}
      <button class="fab-bottom" data-go="add-stock" aria-label="Add">＋</button>
    `;

    el.querySelector('#stock-search').addEventListener('input', (e) => {
      stockSearch = e.target.value.trim().toLowerCase();
      renderers.stock();
    });
  };

  function stockListItem(m) {
    const days = m.expiryDate > 0 ? daysBetween(Date.now(), m.expiryDate) : null;
    let chip = '';
    if (days !== null) {
      if (days < 0) chip = `<span class="chip chip-danger">EXPIRED</span>`;
      else if (days <= 30) chip = `<span class="chip chip-danger">≤30D</span>`;
      else if (days <= 90) chip = `<span class="chip chip-warning">≤90D</span>`;
      else chip = `<span class="chip chip-success">OK</span>`;
    }
    const lowFlag = m.quantity <= (m.lowStockThreshold || 10) ? `<span class="chip chip-warning" style="margin-left:4px">LOW</span>` : '';
    return `
      <div class="list-item clickable" data-go="add-stock" data-arg="${m.id}">
        <div class="avatar info">💊</div>
        <div class="grow">
          <div class="title">${escapeHtml(m.name)}</div>
          <div class="sub">${m.batchNo ? 'Batch ' + escapeHtml(m.batchNo) + ' • ' : ''}Exp ${fmtDate(m.expiryDate)}</div>
          <div class="sub">${m.unitType} • Qty ${m.quantity} • ${rs(m.sellingPrice)} • GST ${m.gstPercent}%</div>
        </div>
        <div class="text-right">${chip}${lowFlag}</div>
      </div>
    `;
  }

  /* ===== ADD/EDIT STOCK ===== */
  renderers['add-stock'] = function (id) {
    document.getElementById('topbar').style.display = '';
    const editing = id ? db.medicines.find(m => m.id === id) : null;
    const m = editing ? Object.assign({}, editing) : {
      id: '', name: '', batchNo: '', manufacturer: '', unitType: 'PIECES',
      quantity: 0, piecesPerUnit: 1, purchasePrice: 0, sellingPrice: 0,
      gstPercent: 12, hsnCode: '', expiryDate: 0, lowStockThreshold: 10
    };

    setTopBar({
      title: editing ? 'Edit Stock' : 'Add Stock',
      gradient: false,
      left: { icon: '←', onclick: () => back() },
      right: editing ? {
        icon: '🗑',
        onclick: () => confirmDialog('Delete "' + m.name + '"?', () => {
          db.medicines = db.medicines.filter(x => x.id !== m.id);
          db.customerPrices = db.customerPrices.filter(x => x.medicineId !== m.id);
          saveDb(); toast('Deleted'); back();
        })
      } : null
    });

    const el = document.getElementById('screen-add-stock');
    el.innerHTML = `
      <div class="card">
        <div class="field">
          <label>Medicine Name *</label>
          <input id="f-name" value="${escapeHtml(m.name)}" placeholder="e.g. Paracetamol 500mg" />
        </div>
        <div class="field">
          <label>Batch Number</label>
          <input id="f-batch" value="${escapeHtml(m.batchNo)}" />
        </div>
        <div class="field">
          <label>Manufacturer</label>
          <input id="f-mfr" value="${escapeHtml(m.manufacturer)}" />
        </div>
        <div class="field">
          <label>Unit Type</label>
          <select id="f-unit">
            ${UNITS.map(u => `<option value="${u}" ${u === m.unitType ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Quantity</label>
            <input id="f-qty" type="number" inputmode="numeric" value="${m.quantity}" />
          </div>
          <div class="field">
            <label id="lab-pcs">Pcs / Unit</label>
            <input id="f-pcs" type="number" inputmode="numeric" value="${m.piecesPerUnit}" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Purchase Price</label>
            <input id="f-pp" type="number" inputmode="decimal" value="${m.purchasePrice}" />
          </div>
          <div class="field">
            <label>Selling (MRP)</label>
            <input id="f-sp" type="number" inputmode="decimal" value="${m.sellingPrice}" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>GST %</label>
            <select id="f-gst">
              ${GST_RATES.map(r => `<option value="${r}" ${r === m.gstPercent ? 'selected' : ''}>${r}%</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>HSN Code</label>
            <input id="f-hsn" value="${escapeHtml(m.hsnCode)}" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Expiry Date</label>
            <input id="f-exp" type="date" value="${dateInputValue(m.expiryDate)}" />
          </div>
          <div class="field">
            <label>Low Alert Qty</label>
            <input id="f-low" type="number" inputmode="numeric" value="${m.lowStockThreshold}" />
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-save-stock">${editing ? 'Update Stock' : 'Save Stock'}</button>
    `;

    const updateLabel = () => {
      const u = el.querySelector('#f-unit').value;
      el.querySelector('#lab-pcs').textContent = u === 'BOX' ? 'Pcs / Box' : 'Pcs / Unit';
    };
    el.querySelector('#f-unit').addEventListener('change', updateLabel);
    updateLabel();

    el.querySelector('#btn-save-stock').onclick = () => {
      const name = el.querySelector('#f-name').value.trim();
      if (!name) { toast('Enter medicine name'); return; }
      const obj = {
        id: m.id || uid(),
        name,
        batchNo: el.querySelector('#f-batch').value.trim(),
        manufacturer: el.querySelector('#f-mfr').value.trim(),
        unitType: el.querySelector('#f-unit').value,
        quantity: parseInt(el.querySelector('#f-qty').value) || 0,
        piecesPerUnit: parseInt(el.querySelector('#f-pcs').value) || 1,

  /* ===== NEW SALE ===== */
  let cart = {

  function resetCart() {
    cart = { customer: null, items: [], discount: 0, isInterState: false, paymentMode: 'CASH', paid: 0 };
  }

  function cartTotals() {
    let sub = 0, gst = 0;
    cart.items.forEach(it => {
      const c = gstCalc(it.unitPrice, it.qty, it.gstPercent, cart.isInterState);
      sub += c.taxable;
      gst += c.gst;
    });
    sub = num2(sub); gst = num2(gst);
    const total = num2(sub + gst - (cart.discount || 0));
    const pending = num2(Math.max(0, total - (cart.paid || 0)));
    return { sub, gst, total, pending };
  }

    function renderList() {
      const filtered = db.medicines.filter(m =>

      return filtered.map(m => `

      onMount: (mEl) => {

        mEl.querySelector('#m-search').oninput = (e) => { search = e.target.value.trim().toLowerCase(); listEl.innerHTML = renderList(); bindPicks(); };
        function bindPicks() {
          listEl.querySelectorAll('[data-pick]').forEach(d => {
            d.onclick = () => { selectedId = d.dataset.pick; listEl.innerHTML = renderList(); bindPicks(); };
          });

            ? (db.customerPrices.find(p => p.customerId === cart.customer.id && p.medicineId === med.id) || {}).specialPrice
            : null;
          const unitPrice = sp != null ? sp : med.sellingPrice;

          const existing = cart.items.find(it => it.medicineId === med.id);

          else cart.items.push({
            medicineId: med.id,
            name: med.name,
            batchNo: med.batchNo,
            hsnCode: med.hsnCode,
            unitType: med.unitType,
            qty: qNum,
            unitPrice,
            gstPercent: med.gstPercent
          });
          closeModal();
          renderers.sale();
        };
      }
    });

  function saveSale() {
    if (cart.items.length === 0) return;
    const t = cartTotals();
    const invoiceNo = nextInvoiceNo();
    const sale = {
      id: uid(),
      invoiceNo,
      customerId: cart.customer ? cart.customer.id : null,
      customerName: cart.customer ? cart.customer.name : 'Walk-in Customer',
      date: Date.now(),
      subTotal: t.sub,
      gstAmount: t.gst,
      discount: cart.discount || 0,
      total: t.total,
      paidAmount: cart.paid || 0,
      pendingAmount: t.pending,
      paymentStatus: t.pending <= 0 ? 'PAID' : (cart.paid > 0 ? 'PARTIAL' : 'PENDING'),
      paymentMode: cart.paymentMode,
      isInterState: cart.isInterState
    };
    db.sales.push(sale);
    cart.items.forEach(it => {
      const c = gstCalc(it.unitPrice, it.qty, it.gstPercent, cart.isInterState);
      db.saleItems.push({
        id: uid(),
        saleId: sale.id,
        medicineId: it.medicineId,
        medicineName: it.name,
        batchNo: it.batchNo || '',
        hsnCode: it.hsnCode || '',
        unitType: it.unitType,
        quantity: it.qty,
        unitPrice: it.unitPrice,
        gstPercent: it.gstPercent,
        gstAmount: c.gst,
        total: c.total
      });
      // reduce stock
      const med = db.medicines.find(m => m.id === it.medicineId);
      if (med) med.quantity = Math.max(0, med.quantity - it.qty);
    });
    if (sale.paidAmount > 0) {
      db.payments.push({
        id: uid(), saleId: sale.id,
        amount: sale.paidAmount, date: sale.date,
        mode: sale.paymentMode, note: 'Initial'
      });
    }
    saveDb();
    resetCart();
    show('invoice', { arg: sale.id, replace: true });
  }

      <div class="center fs-12" style="margin-top:10px;color:#666">Thank you for your business!</div>
    `;

    const paperContent = `<div class="invoice-paper">${headerHtml}${tableHtml}${totalsHtml}</div>`;

    const el = document.getElementById('screen-invoice');
    el.innerHTML = `
      <div class="card" style="background:var(--success-soft);color:var(--success);font-weight:600">
        ✓ Sale Saved — ${escapeHtml(sale.invoiceNo)}
      </div>
      ${paperContent}
      <div class="row gap-8 mt-12">
        <button class="btn btn-outline" id="inv-done" style="flex:1">Done</button>
        <button class="btn btn-primary" id="inv-print" style="flex:2">📤 Save / Share PDF</button>
      </div>
    `;

    el.querySelector('#inv-done').onclick = () => show('home', { replace: true });
    el.querySelector('#inv-print').onclick = () => {
      // Render only invoice into print-area, then print
      const pa = document.getElementById('print-area');
      pa.style.display = 'block';
      pa.innerHTML = paperContent;
      // Use Android bridge if available, otherwise window.print()
      try {
        if (window.Android && typeof Android.printInvoice === 'function') {
          Android.printInvoice(sale.invoiceNo);
        } else {
          window.print();
        }
      } catch (e) {
        window.print();
      }
      // Hide after a moment
      setTimeout(() => { pa.style.display = 'none'; pa.innerHTML = ''; }, 500);
    };
  };

  /* ===== MORE ===== */
  renderers.more = function () {
    setTopBar({ title: 'More' });
    const items = [
      { go: 'customers', icon: '👥', title: 'Customers', sub: 'Manage customers and special prices' },
      { go: 'pending', icon: '🧾', title: 'Pending Payments', sub: 'Track outstanding dues' },
      { go: 'expiry', icon: '⏰', title: 'Expiry Alerts', sub: 'Stock expiring soon' },
      { go: 'profile', icon: '🏪', title: 'My Profile / Store', sub: 'Store name, GSTIN, license' }
    ];
    document.getElementById('screen-more').innerHTML = items.map(it => `
      <div class="list-item clickable" data-go="${it.go}">
        <div class="avatar primary">${it.icon}</div>
        <div class="grow">
          <div class="title">${it.title}</div>
          <div class="sub">${it.sub}</div>
        </div>
        <div class="muted">›</div>
      </div>
    `).join('');
  };

  /* ===== PENDING ===== */
  renderers.pending = function () {
    setTopBar({ title: 'Pending Payments', left: { icon: '←', onclick: () => back() } });
    const list = db.sales.filter(s => s.pendingAmount > 0).sort((a, b) => b.date - a.date);
    const total = list.reduce((a, s) => a + s.pendingAmount, 0);
    const el = document.getElementById('screen-pending');
    el.innerHTML = `
      <div class="card" style="background:var(--danger-soft)">
        <div class="muted fs-12">Total Outstanding</div>
        <div style="font-size:24px;font-weight:700;color:var(--danger)">${rs(total)}</div>
      </div>
      ${list.length === 0 ? `
        <div class="empty"><div class="ic">✅</div><h3>No pending dues</h3><p>All bills are settled</p></div>
      ` : list.map(s => `
        <div class="list-item clickable" data-pay-sale="${s.id}">
          <div class="grow">
            <div class="title">${escapeHtml(s.customerName)}</div>
            <div class="sub">${escapeHtml(s.invoiceNo)} • ${fmtDate(s.date)}</div>
            <div class="sub">Total ${rs(s.total)} • Paid ${rs(s.paidAmount)}</div>
          </div>
          <div class="text-right">
            <div class="fs-12 text-danger">Due</div>
            <div class="bold text-danger fs-16">${rs(s.pendingAmount)}</div>
          </div>
        </div>
      `).join('')}
    `;
    el.querySelectorAll('[data-pay-sale]').forEach(d => {
      d.onclick = () => openPaymentDialog(d.dataset.paySale);
    });
  };

  function openPaymentDialog(saleId) {
    const sale = db.sales.find(s => s.id === saleId);
    if (!sale) return;
    let amount = sale.pendingAmount;
    let mode = 'CASH', note = '';
    modal(`
      <h2>Record Payment</h2>
      <p class="muted fs-14">${escapeHtml(sale.customerName)} • ${escapeHtml(sale.invoiceNo)}</p>
      <p class="text-danger semibold">Pending: ${rs(sale.pendingAmount)}</p>
      <div class="field"><label>Amount</label><input id="pd-amt" type="number" inputmode="decimal" value="${amount}"/></div>
      <div class="field">
        <label>Mode</label>
        <select id="pd-mode">${PAYMENT_MODES.map(m => `<option>${m}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Note (optional)</label><input id="pd-note"/></div>
      <div class="modal-actions">
        <button class="btn btn-outline" data-act="cancel">Cancel</button>
        <button class="btn btn-primary" data-act="ok">Record</button>
      </div>
    `, {
      onMount: (m) => {
        m.querySelector('[data-act="cancel"]').onclick = closeModal;
        m.querySelector('[data-act="ok"]').onclick = () => {
          const a = parseFloat(m.querySelector('#pd-amt').value);
          if (!a || a <= 0) { toast('Enter amount'); return; }
          mode = m.querySelector('#pd-mode').value;
          note = m.querySelector('#pd-note').value.trim();
          db.payments.push({ id: uid(), saleId: sale.id, amount: a, date: Date.now(), mode, note });
          sale.paidAmount = num2(sale.paidAmount + a);
          sale.pendingAmount = num2(Math.max(0, sale.total - sale.paidAmount));
          sale.paymentStatus = sale.pendingAmount <= 0 ? 'PAID' : 'PARTIAL';
          saveDb();
          closeModal();
          toast('Payment recorded');
          renderers.pending();
        };
      }
    });
  }

  /* ===== EXPIRY ===== */
  renderers.expiry = function () {
    setTopBar({ title: 'Expiry Alerts', left: { icon: '←', onclick: () => back() } });
    const cutoff = daysFromNow(180);
    const list = db.medicines
      .filter(m => m.expiryDate > 0 && m.expiryDate <= cutoff)
      .sort((a, b) => a.expiryDate - b.expiryDate);
    const el = document.getElementById('screen-expiry');
    if (list.length === 0) {
      el.innerHTML = `<div class="empty"><div class="ic">✅</div><h3>All clear</h3><p>No medicines expiring within 6 months.</p></div>`;
      return;
    }
    el.innerHTML = list.map(m => {
      const days = daysBetween(Date.now(), m.expiryDate);
      let cls = 'success', label = days + 'D LEFT', avatar = 'success';
      if (days < 0) { cls = 'danger'; label = 'EXPIRED'; avatar = 'danger'; }
      else if (days <= 30) { cls = 'danger'; label = days + 'D LEFT'; avatar = 'danger'; }
      else if (days <= 90) { cls = 'warning'; label = days + 'D LEFT'; avatar = 'warning'; }
      return `
        <div class="list-item">
          <div class="avatar ${avatar}">⏰</div>
          <div class="grow">
            <div class="title">${escapeHtml(m.name)}</div>
            <div class="sub">Batch ${escapeHtml(m.batchNo || '-')} • Qty ${m.quantity} • Exp ${fmtDate(m.expiryDate)}</div>
          </div>
          <span class="chip chip-${cls}">${label}</span>
        </div>`;
    }).join('');
  };

  /* ===== PROFILE ===== */
  renderers.profile = function () {
    setTopBar({ title: 'My Profile / Store', left: { icon: '←', onclick: () => back() } });
    const p = db.profile;
    const el = document.getElementById('screen-profile');
    el.innerHTML = `
      <div class="card">
        <div class="muted fs-12 mb-8">These details appear on every invoice.</div>
        <div class="field"><label>Owner / Pharmacist Name</label><input id="p-owner" value="${escapeHtml(p.ownerName)}"/></div>
        <div class="field"><label>Store Name</label><input id="p-store" value="${escapeHtml(p.storeName)}"/></div>
        <div class="field"><label>Address</label><textarea id="p-addr">${escapeHtml(p.address)}</textarea></div>
        <div class="field-row">
          <div class="field"><label>State</label><input id="p-state" value="${escapeHtml(p.state)}"/></div>
          <div class="field"><label>Code</label><input id="p-code" value="${escapeHtml(p.stateCode)}"/></div>
        </div>
        <div class="field"><label>Phone</label><input id="p-phone" type="tel" inputmode="numeric" value="${escapeHtml(p.phone)}"/></div>
        <div class="field"><label>Email</label><input id="p-email" type="email" value="${escapeHtml(p.email)}"/></div>
        <div class="field"><label>GSTIN</label><input id="p-gst" value="${escapeHtml(p.gstNo)}"/></div>
        <div class="field"><label>Drug License No.</label><input id="p-dl" value="${escapeHtml(p.drugLicenseNo)}"/></div>
        <div class="field"><label>Invoice Prefix</label><input id="p-pre" value="${escapeHtml(p.invoicePrefix || 'INV')}"/></div>
      </div>
      <button class="btn btn-primary btn-block" id="p-save">Save Profile</button>

      <div class="section-title">Backup / Restore</div>
      <div class="card">
        <div class="row gap-8">
          <button class="btn btn-outline" id="p-export" style="flex:1">⬇ Export Data</button>
          <button class="btn btn-outline" id="p-import" style="flex:1">⬆ Import Data</button>
        </div>
        <div class="muted fs-12 mt-8">
          Export saves all your data as a JSON file you can email to yourself.
          Import restores it on a new device.
        </div>
        <button class="btn btn-outline" id="p-clear" style="margin-top:8px;color:var(--danger)">Reset All Data</button>
      </div>
    `;

    el.querySelector('#p-save').onclick = () => {
      db.profile.ownerName = el.querySelector('#p-owner').value.trim();
      db.profile.storeName = el.querySelector('#p-store').value.trim();
      db.profile.address = el.querySelector('#p-addr').value.trim();
      db.profile.state = el.querySelector('#p-state').value.trim();
      db.profile.stateCode = el.querySelector('#p-code').value.trim();
      db.profile.phone = el.querySelector('#p-phone').value.trim();
      db.profile.email = el.querySelector('#p-email').value.trim();
      db.profile.gstNo = el.querySelector('#p-gst').value.trim().toUpperCase();
      db.profile.drugLicenseNo = el.querySelector('#p-dl').value.trim().toUpperCase();
      db.profile.invoicePrefix = (el.querySelector('#p-pre').value.trim() || 'INV').toUpperCase();
      saveDb();
      toast('Profile saved');
      back();
    };
    el.querySelector('#p-export').onclick = exportData;
    el.querySelector('#p-import').onclick = importData;
    el.querySelector('#p-clear').onclick = () => {
      confirmDialog('This will delete ALL stock, customers, sales and the profile. This cannot be undone.', () => {
        db = defaultDb(); saveDb(); toast('All data cleared'); show('home', { replace: true });
      }, 'Yes, reset all');
    };
  };

  function exportData() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'medi-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const parsed = JSON.parse(r.result);
          if (!parsed.medicines || !parsed.profile) throw new Error('Invalid backup');
          db = Object.assign(defaultDb(), parsed);
          saveDb();
          toast('Data imported');
          show('home', { replace: true });
        } catch (err) { toast('Import failed: ' + err.message); }
      };
      r.readAsText(f);
    };
    input.click();
  }

  /* ---------- 8. Event delegation ---------- */
  document.addEventListener('click', (e) => {
    const goEl = e.target.closest('[data-go]');
    if (goEl) {
      const target = goEl.dataset.go;
      const arg = goEl.dataset.arg || null;
      if (target === 'sale') resetCart();
      show(target, { arg });
      e.preventDefault();
    }
  });

  // Bottom nav
  document.getElementById('bottomnav').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    const tab = b.dataset.tab;
    if (tab === 'sale') { resetCart(); show('sale', { replace: false }); }
    else show(tab, { replace: false });
  });

  /* ---------- 9. Init ---------- */
  function init() {
    loadDb();
    show('home', { replace: true });
  }

  /* Public API for back button (called from Android) */
  function handleBack() {
    // If a modal is open, close it
    if (document.querySelector('.modal-overlay')) { closeModal(); return true; }
    if (screenStack.length > 1) { back(); return true; }
    return false;
  }

  document.addEventListener('DOMContentLoaded', init);

  return { handleBack };
})();
</script>
</body>
</html>
